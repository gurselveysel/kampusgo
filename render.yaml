# TEYS arXivisual controlled-pilot Blueprint.
# Importing this file creates billable Render resources. Review the current
# instance and disk price before confirming. Automatic deploys/previews are off.

previews:
  generation: off

services:
  - type: web
    name: teys-medical-simulation-engine-pilot
    runtime: docker
    repo: https://github.com/gurselveysel/kampusgo
    branch: feature/teys-medical-simulation-live-pilot
    region: frankfurt
    plan: standard
    autoDeployTrigger: off
    dockerfilePath: ./services/medical-simulation-engine/Dockerfile.pilot
    dockerContext: ./services/medical-simulation-engine
    healthCheckPath: /api/medical/health
    maxShutdownDelaySeconds: 300
    numInstances: 1
    disk:
      name: medical-simulation-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MEDICAL_SIMULATION_API_KEY
        sync: false
      - key: MEDICAL_SIMULATION_ALLOW_UNAUTHENTICATED
        value: "false"
      - key: MEDICAL_SIMULATION_DOCS_ENABLED
        value: "false"
      - key: MEDICAL_SIMULATION_MAX_REQUEST_BYTES
        value: "1048576"
      - key: MEDICAL_SIMULATION_MAX_JOBS_PER_WINDOW
        value: "3"
      - key: MEDICAL_SIMULATION_RATE_WINDOW_SECONDS
        value: "3600"
      - key: MEDICAL_SIMULATION_RENDER_CONCURRENCY
        value: "1"
      - key: MEDICAL_SIMULATION_JOB_DIR
        value: /data/jobs
      - key: MEDIA_DIR
        value: /data/media/videos
      - key: VOICEOVER_CACHE_DIR
        value: /data/cache/voiceovers
      - key: STORAGE_MODE
        value: local
      - key: RENDER_MODE
        value: local
      - key: CORS_ALLOWED_ORIGINS
        value: https://teys-medikal-simulasyon-pilot.vercel.app
      - key: LLM_PROVIDER
        value: azure
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_REASONING_EFFORT
        value: low
      - key: VOICEOVER_TTS_SERVICE
        value: gtts
      - key: VOICEOVER_VOICE_NAME
        value: nova
