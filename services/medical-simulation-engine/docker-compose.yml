services:
  medical-simulation-engine:
    build:
      context: ../..
      dockerfile: services/medical-simulation-engine/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      ALLOW_GENERATED_MANIM_EXECUTION: "0"
      TEYS_UPSTREAM_BACKEND: /app/visual-lab-upstream/backend
    volumes:
      - medical-renders:/app/media/renders
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /home/simulator/.cache:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  medical-renders:
