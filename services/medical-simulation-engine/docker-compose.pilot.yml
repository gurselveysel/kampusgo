services:
  medical-simulation-api:
    build:
      context: .
      dockerfile: Dockerfile.pilot
    env_file:
      - .env
    environment:
      PORT: "8000"
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - medical_simulation_data:/data
    tmpfs:
      - /tmp:rw,nosuid,size=1073741824
      - /home/medical-simulation/.cache:rw,nosuid,size=536870912
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import httpx; r=httpx.get('http://127.0.0.1:8000/api/medical/health', timeout=8); r.raise_for_status()"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  medical_simulation_data:
