[project]
name = "teys-medical-simulation-engine"
version = "0.2.0"
description = "TEYS/MAMS synthetic clinical simulation planning, Manim generation and isolated rendering service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
render = [
  "manim>=0.18.0",
  "manim-voiceover[gtts,openai]>=0.3.0",
  "openai>=1.60.0",
  "langfuse>=3.0.0",
  "dedalus-labs>=0.2.0",
  "boto3>=1.34.0",
  "modal>=0.60.0",
  "setuptools>=65.0.0",
]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runtime"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
