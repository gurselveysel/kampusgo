[project]
name = "teys-medical-simulation-engine"
version = "0.1.0"
description = "Prerequisite-gated synthetic medical education simulation with an arXivisual Manim/AI adapter"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "openai>=1.60.0",
  "langfuse>=3.0.0",
  "dedalus-labs>=0.2.0",
  "manim>=0.18.0",
  "manim-voiceover[gtts,openai]>=0.3.0",
  "setuptools>=65.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.9.0",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
