previews:
  generation: off

services:
  - type: web
    name: teys-medical-simulation-engine-pilot
    runtime: docker
    repo: https://github.com/gurselveysel/kampusgo
    branch: feature/teys-medical-simulation-live-pilot
    region: frankfurt
    plan: standard
    autoDeployTrigger: off
    dockerfilePath: ./services/medical-simulation-engine/Dockerfile
    dockerContext: ./services/medical-simulation-engine
    healthCheckPath: /api/medical/health
    maxShutdownDelaySeconds: 300
    numInstances: 1
    disk:
      name: teys-medical-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TEYS_ENGINE_API_KEY
        sync: false
      - key: TEYS_ENGINE_DOCS_ENABLED
        value: "false"
      - key: TEYS_ENGINE_JOB_LIMIT_PER_HOUR
        value: "3"
      - key: TEYS_ENGINE_MAX_CONCURRENT_JOBS
        value: "1"
      - key: MEDICAL_AI_MODE
        value: auto
      - key: MEDICAL_VOICEOVER_ENABLED
        value: "false"
      - key: MEDICAL_RENDER_QUALITY
        value: low_quality
      - key: CORS_ALLOWED_ORIGINS
        value: https://teys-medikal-simulasyon-pilot.vercel.app
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_REASONING_EFFORT
        value: low
