name: Visual Lab Integration QA

on:
  push:
    branches:
      - feature/arxivisual-upstream-integration
    paths:
      - "app/api/visual-lab/**"
      - "app/gorsel-akademi/**"
      - "services/visual-lab/**"
      - "scripts/visual-lab/**"
      - ".env.example"
      - ".gitignore"
      - ".vercelignore"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/visual-lab-integration-qa.yml"
  pull_request:
    paths:
      - "app/api/visual-lab/**"
      - "app/gorsel-akademi/**"
      - "services/visual-lab/**"
      - "scripts/visual-lab/**"
      - ".env.example"
      - ".gitignore"
      - ".vercelignore"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/visual-lab-integration-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-lab-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned upstream source snapshot
        shell: bash
        run: |
          set -euo pipefail
          target="services/visual-lab/upstream/arxivisual"
          test -d "$target"
          test ! -d "$target/.git"
          test -s "services/visual-lab/UPSTREAM_FILES.sha256"
          (
            cd "$target"
            sha256sum --check ../../UPSTREAM_FILES.sha256
          )

      - name: Reject files above GitHub's normal file limit
        shell: bash
        run: |
          set -euo pipefail
          oversized="$(find services/visual-lab/upstream/arxivisual -type f -size +99M -print -quit)"
          if [[ -n "$oversized" ]]; then
            echo "File exceeds 100 MB: $oversized" >&2
            exit 1
          fi

  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile upstream and overlay Python sources
        run: |
          python -m compileall -q services/visual-lab/upstream/arxivisual/backend
          python -m compileall -q services/visual-lab/overlays/backend

      - name: Enforce controlled-pilot security defaults
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^VISUAL_LAB_RAW_RENDER_ENABLED=false$' services/visual-lab/.env.example
          grep -q 'path == "/api/render"' services/visual-lab/overlays/backend/main.py
          grep -q 'productionAllowed.*False' services/visual-lab/overlays/backend/main.py
          grep -q 'X-Visual-Lab-Key' services/visual-lab/PILOT-RUNBOOK.md

      - name: Validate Docker Compose model
        shell: bash
        run: |
          set -euo pipefail
          cp services/visual-lab/.env.example services/visual-lab/.env
          docker compose -f services/visual-lab/docker-compose.pilot.yml config --quiet
          rm services/visual-lab/.env

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
