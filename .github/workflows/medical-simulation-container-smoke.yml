name: TEYS arXivisual Container Smoke

on:
  push:
    branches:
      - feature/teys-medical-simulation-live-pilot
    paths:
      - "services/medical-simulation-engine/**"
      - ".github/workflows/medical-simulation-container-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teys-medical-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build controlled-pilot image
        run: >-
          docker build
          -f services/medical-simulation-engine/Dockerfile.pilot
          -t teys-medical-simulation:smoke
          services/medical-simulation-engine
      - name: Start bounded container
        run: |
          docker run -d --name teys-medical-smoke \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=1073741824 \
            --tmpfs /home/medical-simulation/.cache:rw,nosuid,size=536870912 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --memory 4g \
            --cpus 2 \
            -p 127.0.0.1:8002:8000 \
            -e ENVIRONMENT=production \
            -e MEDICAL_SIMULATION_API_KEY=0123456789abcdef0123456789abcdef \
            -e AZURE_OPENAI_ENDPOINT=https://example.openai.azure.com \
            -e AZURE_OPENAI_API_KEY=smoke-test-placeholder \
            -e AZURE_OPENAI_DEPLOYMENT=gpt-5 \
            teys-medical-simulation:smoke
      - name: Verify health and security boundary
        shell: bash
        run: |
          for attempt in {1..24}; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8002/api/medical/health || true)"
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          test "$(curl -sS -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8002/api/medical/health)" = "200"
          grep -q '"rawRenderEnabled":false' /tmp/health.json
          grep -q '"productionAllowed":false' /tmp/health.json
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8002/api/medical/pilot)" = "401"
          test "$(curl -sS -o /tmp/pilot.json -w '%{http_code}' -H 'X-Medical-Simulation-Key: 0123456789abcdef0123456789abcdef' http://127.0.0.1:8002/api/medical/pilot)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'X-Medical-Simulation-Key: 0123456789abcdef0123456789abcdef' http://127.0.0.1:8002/api/render)" = "404"
          test "$(docker exec teys-medical-smoke id -u)" != "0"
      - name: Show logs on failure
        if: failure()
        run: docker logs teys-medical-smoke
