name: KampüsGO Feature QA

on:
  push:
    branches:
      - feature/teys-medical-simulation-live-pilot
    paths:
      - "app/medikal-simulasyon/**"
      - "services/medical-simulation-engine/**"
      - "scripts/medical-simulation-contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gorsel-akademi-demo-qa.yml"
      - "src/server/medical-simulation.ts"
      - "render.yaml"
  pull_request:
    paths:
      - "app/gorsel-akademi/**"
      - "app/medikal-simulasyon/**"
      - "services/medical-simulation-engine/**"
      - "scripts/medical-simulation-contract.mjs"
      - "app/layout.tsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gorsel-akademi-demo-qa.yml"
      - ".github/workflows/vendor-arxivisual-backend.yml"
      - "src/server/medical-simulation.ts"
      - "render.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kampusgo-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-arxivisual-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned arXivisual snapshot boundary
        shell: bash
        run: |
          engine="services/medical-simulation-engine"
          commit="$(tr -d '\r\n' < "$engine/UPSTREAM_COMMIT")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          test -f "$engine/UPSTREAM_SOURCE.md"
          test -f "$engine/vendor/arxivisual-backend/pyproject.toml"
          test -f "$engine/vendor/arxivisual-backend/agents/manim_generator.py"
          test -f "$engine/vendor/arxivisual-backend/rendering/local_runner.py"
          test ! -e "$engine/vendor/arxivisual-backend/.env"
          test -z "$(find "$engine/vendor/arxivisual-backend" -type f \
            \( -name 'arxiviz.db*' -o -name '*.pem' -o -name '*.key' \) -print -quit)"
          echo "Pinned arXivisual source: $commit"

  next-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/medical-simulation-contract.mjs
      - run: npm run build

  medical-adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install offline contract dependencies
        run: python -m pip install fastapi httpx pydantic pytest python-dotenv
      - name: Compile medical adapter
        run: python -m compileall -q services/medical-simulation-engine/overlays/backend
      - name: Run medical adapter contract tests
        run: python -m pytest -q services/medical-simulation-engine/tests
