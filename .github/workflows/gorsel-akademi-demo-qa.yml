name: Görsel Akademi Demo QA

on:
  pull_request:
    paths:
      - "app/gorsel-akademi/page.tsx"
      - "app/gorsel-akademi/gorsel-akademi.module.css"
      - "app/layout.tsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gorsel-akademi-demo-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gorsel-akademi-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
