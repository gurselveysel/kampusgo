name: Apply TEYS Medical Simulation

on:
  push:
    branches:
      - feature/teys-medical-simulation
    paths:
      - "tools/teys-medical-simulation-bundle/**"
      - ".github/workflows/apply-teys-medical-simulation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-teys-medical-simulation
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout TEYS feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/teys-medical-simulation
          fetch-depth: 0

      - name: Reconstruct and verify implementation bundle
        shell: bash
        run: |
          set -euo pipefail
          cat tools/teys-medical-simulation-bundle/part-* | base64 --decode > /tmp/teys-bundle.tar.gz
          echo "31e012010ec274e895d353e1e473e790568be0185440f08626ba6f23143b393f  /tmp/teys-bundle.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/teys-bundle.tar.gz -C .
          rm -rf services/medical-simulation-engine/app/__pycache__ \
                 services/medical-simulation-engine/app/scenes/__pycache__ \
                 services/medical-simulation-engine/tests/__pycache__ \
                 services/medical-simulation-engine/.pytest_cache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate deterministic clinical engine
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pydantic>=2.8" "pytest>=8"
          cd services/medical-simulation-engine
          python -m compileall -q app tests
          python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Next.js medical simulation UI
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/medikal-simulasyon services/medical-simulation-engine
          if git diff --cached --quiet; then
            echo "Validated implementation is already committed."
            exit 0
          fi
          git commit -m "feat: add TEYS medical simulation and clinical Manim AI adapter"
          git push origin HEAD:feature/teys-medical-simulation
