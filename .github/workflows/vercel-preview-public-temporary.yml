name: Temporary - make MYYS Preview public

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vercel-preview-public-temporary.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: vercel-preview-public-temporary
  cancel-in-progress: true

jobs:
  disable-vercel-authentication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Authorize and disable only Vercel Authentication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          (async () => {
            const clientId = "cl_HYyOPBNtFMfHhaUn9L4QPfTZz6TP47bp";
            const projectId = "prj_yTNVgAcAkINcD485xB3LYEPZ6PsW";
            const teamId = "team_QH2k9edmHSXuybZK3Ay9RVAo";
            const deploymentId = "dpl_FhBfxWbmM1FEnAotXZ3KMszzV4pu";
            const domain = "kampusgo.uzemgo.com";
            const repo = process.env.GITHUB_REPOSITORY;
            const githubToken = process.env.GITHUB_TOKEN;
            const githubHeaders = {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${githubToken}`,
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json"
            };

            async function jsonRequest(url, options = {}) {
              const response = await fetch(url, options);
              const text = await response.text();
              let data;
              try { data = text ? JSON.parse(text) : {}; }
              catch { data = { message: text.slice(0, 500) }; }
              return { response, data };
            }

            async function updateIssue(issueNumber, body, state) {
              await fetch(`https://api.github.com/repos/${repo}/issues/${issueNumber}`, {
                method: "PATCH",
                headers: githubHeaders,
                body: JSON.stringify({ body, ...(state ? { state } : {}) })
              });
            }

            let issueNumber;
            let accessToken;
            try {
              const discovery = await jsonRequest("https://vercel.com/.well-known/openid-configuration");
              if (!discovery.response.ok) throw new Error("Vercel OAuth discovery failed");

              const device = await jsonRequest(discovery.data.device_authorization_endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({ client_id: clientId, scope: "openid offline_access" })
              });
              if (!device.response.ok) throw new Error("Vercel device authorization could not start");

              const issue = await jsonRequest(`https://api.github.com/repos/${repo}/issues`, {
                method: "POST",
                headers: githubHeaders,
                body: JSON.stringify({
                  title: "[GEÇİCİ] KDPÜ MYYS Preview erişim yetkilendirmesi",
                  body: [
                    "Bu tek kullanımlık işlem **kampusgo.uzemgo.com** üzerindeki Vercel giriş ekranını kaldırır.",
                    "",
                    "Yalnız proje düzeyindeki **Vercel Authentication** ayarı kapatılacaktır.",
                    "",
                    "Production deployment oluşturulmaz veya promote edilmez.",
                    "",
                    `[Vercel’de yetkilendir](${device.data.verification_uri_complete})`,
                    "",
                    `Tek kullanımlık kod: **${device.data.user_code}**`,
                    "",
                    "İşlem tamamlanınca bu kayıt otomatik kapatılacaktır."
                  ].join("\n")
                })
              });
              if (!issue.response.ok) throw new Error("Temporary authorization notice could not be created");
              issueNumber = issue.data.number;
              console.log(`AUTHORIZATION_NOTICE=${issue.data.html_url}`);

              let intervalMs = Math.max(5, Number(device.data.interval || 5)) * 1000;
              const deadline = Date.now() + Math.min(Number(device.data.expires_in || 600), 720) * 1000;
              while (Date.now() < deadline) {
                await new Promise(resolve => setTimeout(resolve, intervalMs));
                const token = await jsonRequest(discovery.data.token_endpoint, {
                  method: "POST",
                  headers: { "Content-Type": "application/x-www-form-urlencoded" },
                  body: new URLSearchParams({
                    client_id: clientId,
                    grant_type: "urn:ietf:params:oauth:grant-type:device_code",
                    device_code: device.data.device_code
                  })
                });
                if (token.response.ok && token.data.access_token) {
                  accessToken = token.data.access_token;
                  break;
                }
                if (token.data.error === "authorization_pending") continue;
                if (token.data.error === "slow_down") { intervalMs += 5000; continue; }
                throw new Error(`Vercel authorization failed: ${token.data.error || token.response.status}`);
              }
              if (!accessToken) throw new Error("Vercel authorization timed out");

              const vercelHeaders = {
                Authorization: `Bearer ${accessToken}`,
                "Content-Type": "application/json"
              };
              const projectUrl = `https://api.vercel.com/v9/projects/${projectId}?teamId=${teamId}`;
              const before = await jsonRequest(projectUrl, { headers: vercelHeaders });
              if (!before.response.ok || before.data.id !== projectId) {
                throw new Error(`Project preflight failed: ${before.response.status}`);
              }
              console.log(`PROTECTION_BEFORE=${JSON.stringify(before.data.ssoProtection ?? null)}`);

              const changed = await jsonRequest(projectUrl, {
                method: "PATCH",
                headers: vercelHeaders,
                body: JSON.stringify({ ssoProtection: null })
              });
              if (!changed.response.ok) {
                throw new Error(`Protection update failed: ${changed.response.status} ${changed.data.message || ""}`);
              }
              if (changed.data.ssoProtection !== null) {
                throw new Error("Vercel Authentication is still enabled");
              }

              const deployment = await jsonRequest(
                `https://api.vercel.com/v13/deployments/${deploymentId}?teamId=${teamId}`,
                { headers: vercelHeaders }
              );
              if (!deployment.response.ok || deployment.data.id !== deploymentId) {
                throw new Error("Deployment verification failed");
              }
              if (deployment.data.target != null) {
                throw new Error(`Deployment target changed: ${deployment.data.target}`);
              }
              if (deployment.data.readyState !== "READY") {
                throw new Error(`Deployment is not READY: ${deployment.data.readyState}`);
              }
              accessToken = undefined;

              let publicResult;
              for (let attempt = 1; attempt <= 12; attempt++) {
                const response = await fetch(`https://${domain}/`, { redirect: "follow" });
                const html = await response.text();
                const ok = response.status === 200
                  && response.url.startsWith(`https://${domain}/`)
                  && html.includes("KONTROLLÜ PİLOT")
                  && html.includes("Mikro Yeterlilik Yönetim Sistemi");
                if (ok) {
                  publicResult = `${response.status} ${response.url}`;
                  break;
                }
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
              if (!publicResult) throw new Error("Anonymous custom-domain verification failed");

              await updateIssue(issueNumber, [
                "Tamamlandı.",
                "",
                `**https://${domain}** artık Vercel hesabı gerektirmeden açılıyor.`,
                "",
                "Deployment hâlâ **READY Preview** (`target: null`).",
                "",
                "Production deploy/promote yapılmadı."
              ].join("\n"), "closed");
              console.log(`PUBLIC_ACCESS_VERIFIED=${publicResult}`);
            } catch (error) {
              accessToken = undefined;
              if (issueNumber) {
                await updateIssue(issueNumber, [
                  "İşlem tamamlanamadı.",
                  "",
                  "Hata özeti:",
                  `\`\`\`text\n${String(error.message || error).slice(0, 800)}\n\`\`\``,
                  "",
                  "Production deploy/promote komutu çalıştırılmadı."
                ].join("\n"), "open");
              }
              throw error;
            }
          })();
          NODE
