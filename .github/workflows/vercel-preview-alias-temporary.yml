name: Temporary - alias MYYS nine-role Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vercel-preview-alias-temporary.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: vercel-preview-alias-temporary
  cancel-in-progress: true

jobs:
  alias-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Authorize and assign only the public Preview alias
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          (async () => {
            const clientId = "cl_HYyOPBNtFMfHhaUn9L4QPfTZz6TP47bp";
            const deploymentId = "dpl_9QguXhdHXDpn5wtm5xgbjEPk6q9W";
            const teamId = "team_QH2k9edmHSXuybZK3Ay9RVAo";
            const domain = "kampusgo.uzemgo.com";
            const repo = process.env.GITHUB_REPOSITORY;
            const githubHeaders = {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json"
            };

            async function jsonRequest(url, options = {}) {
              const response = await fetch(url, options);
              const text = await response.text();
              let data;
              try { data = text ? JSON.parse(text) : {}; }
              catch { data = { message: text.slice(0, 500) }; }
              return { response, data, text };
            }

            async function updateIssue(number, body, state) {
              await fetch(`https://api.github.com/repos/${repo}/issues/${number}`, {
                method: "PATCH",
                headers: githubHeaders,
                body: JSON.stringify({ body, ...(state ? { state } : {}) })
              });
            }

            let issueNumber;
            let accessToken;
            try {
              const discovery = await jsonRequest("https://vercel.com/.well-known/openid-configuration");
              if (!discovery.response.ok) throw new Error("Vercel OAuth discovery failed");

              const device = await jsonRequest(discovery.data.device_authorization_endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({ client_id: clientId, scope: "openid offline_access" })
              });
              if (!device.response.ok) throw new Error("Vercel device authorization could not start");

              const issue = await jsonRequest(`https://api.github.com/repos/${repo}/issues`, {
                method: "POST",
                headers: githubHeaders,
                body: JSON.stringify({
                  title: "[GEÇİCİ] MYYS 9 rol Preview alias yetkilendirmesi",
                  body: [
                    "Bu tek kullanımlık işlem yeni, doğrulanmış **9 rol Preview** dağıtımını **kampusgo.uzemgo.com** alanına bağlar.",
                    "",
                    "Production deployment oluşturulmaz veya promote edilmez.",
                    "",
                    `[Vercel’de yetkilendir](${device.data.verification_uri_complete})`,
                    "",
                    `Tek kullanımlık kod: **${device.data.user_code}**`,
                    "",
                    "İşlem tamamlanınca bu kayıt otomatik kapatılacaktır."
                  ].join("\n")
                })
              });
              if (!issue.response.ok) throw new Error("Authorization notice could not be created");
              issueNumber = issue.data.number;
              console.log(`AUTHORIZATION_NOTICE=${issue.data.html_url}`);

              let intervalMs = Math.max(5, Number(device.data.interval || 5)) * 1000;
              const deadline = Date.now() + Math.min(Number(device.data.expires_in || 600), 720) * 1000;
              while (Date.now() < deadline) {
                await new Promise(resolve => setTimeout(resolve, intervalMs));
                const token = await jsonRequest(discovery.data.token_endpoint, {
                  method: "POST",
                  headers: { "Content-Type": "application/x-www-form-urlencoded" },
                  body: new URLSearchParams({
                    client_id: clientId,
                    grant_type: "urn:ietf:params:oauth:grant-type:device_code",
                    device_code: device.data.device_code
                  })
                });
                if (token.response.ok && token.data.access_token) {
                  accessToken = token.data.access_token;
                  break;
                }
                if (token.data.error === "authorization_pending") continue;
                if (token.data.error === "slow_down") { intervalMs += 5000; continue; }
                throw new Error(`Vercel authorization failed: ${token.data.error || token.response.status}`);
              }
              if (!accessToken) throw new Error("Vercel authorization timed out");

              const vercelHeaders = {
                Authorization: `Bearer ${accessToken}`,
                "Content-Type": "application/json"
              };
              const deployment = await jsonRequest(
                `https://api.vercel.com/v13/deployments/${deploymentId}?teamId=${teamId}`,
                { headers: vercelHeaders }
              );
              if (!deployment.response.ok || deployment.data.id !== deploymentId) throw new Error("Deployment verification failed");
              if (deployment.data.target != null) throw new Error(`NO-GO: deployment target is ${deployment.data.target}`);
              if (deployment.data.readyState !== "READY") throw new Error(`Deployment is not READY: ${deployment.data.readyState}`);

              const alias = await jsonRequest(
                `https://api.vercel.com/v2/deployments/${deploymentId}/aliases?teamId=${teamId}`,
                {
                  method: "POST",
                  headers: vercelHeaders,
                  body: JSON.stringify({ alias: domain, redirect: null })
                }
              );
              if (!alias.response.ok || alias.data.alias !== domain) {
                throw new Error(`Preview alias failed: ${alias.response.status} ${alias.data.message || ""}`);
              }
              accessToken = undefined;

              let publicResult;
              for (let attempt = 1; attempt <= 12; attempt += 1) {
                const response = await fetch(`https://${domain}/src/data.js?qa=${Date.now()}`, {
                  redirect: "follow",
                  cache: "no-store"
                });
                const source = await response.text();
                if (response.status === 200 && source.includes("version: 6") && source.includes("recipientRoles")) {
                  const root = await fetch(`https://${domain}/?qa=${Date.now()}`, { redirect: "follow", cache: "no-store" });
                  const html = await root.text();
                  if (root.status === 200 && root.url.startsWith(`https://${domain}/pilot.html`) && html.includes("KONTROLLÜ PİLOT")) {
                    publicResult = `${root.status} ${root.url}`;
                    break;
                  }
                }
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
              if (!publicResult) throw new Error("Anonymous custom-domain verification failed");

              await updateIssue(issueNumber, [
                "Tamamlandı.",
                "",
                `**https://${domain}** yeni 9 rol Preview dağıtımını gösteriyor.`,
                "",
                `Deployment: **${deploymentId}** — **READY Preview** (target: null).`,
                "",
                "Production deploy/promote yapılmadı."
              ].join("\n"), "closed");
              console.log(`PUBLIC_PREVIEW_VERIFIED=${publicResult}`);
            } catch (error) {
              accessToken = undefined;
              if (issueNumber) {
                await updateIssue(issueNumber, [
                  "İşlem tamamlanamadı.",
                  "",
                  "```text\\n" + String(error.message || error).slice(0, 800) + "\\n```",
                  "",
                  "Production deploy/promote komutu çalıştırılmadı."
                ].join("\n"), "open");
              }
              throw error;
            }
          })();
          NODE
